name: Fineract Publish to ECR

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'af-south-1'
        type: choice
        options:
          - af-south-1
          - eu-west-1
          - us-east-1
      image_tag:
        description: 'Image tag (leave empty for git SHA)'
        required: false
        type: string

  push:
    branches:
      - develop
    tags:
      - 1.*

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: fineract-app/core
  AWS_REGION: ${{ inputs.aws_region || 'af-south-1' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_url: ${{ steps.meta.outputs.image_url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972fe1d090086d84e38e # v4.4.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Get Image Metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          LONG_SHA=$(git rev-parse HEAD)

          # Determine tag
          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [ "${{ github.ref_name }}" == "develop" ]; then
            IMAGE_TAG="${SHORT_SHA}"
          else
            IMAGE_TAG="${{ github.ref_name }}"
          fi

          # Build tags string
          if [ "${{ github.ref_name }}" == "develop" ]; then
            TAGS="${IMAGE_TAG},${LONG_SHA},latest"
          else
            TAGS="${IMAGE_TAG}"
          fi

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_url=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          ./gradlew --no-daemon --console=plain :fineract-provider:jib -x test -x cucumber \
            -Djib.to.image=${ECR_REGISTRY}/${ECR_REPOSITORY} \
            -Djib.to.tags=${{ steps.meta.outputs.tags }} \
            -Djib.from.platforms=linux/amd64,linux/arm64

      - name: Output Summary
        run: |
          echo "### ECR Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Git Ref | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ steps.meta.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image URL | \`${{ steps.meta.outputs.image_url }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
